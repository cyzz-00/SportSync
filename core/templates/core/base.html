<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}SportSync{% endblock %}</title>

    <!-- Tailwind para desarrollo local -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex min-h-screen flex-col bg-[#0086b5] font-sans text-white">

    <!-- Encabezado -->
    <header class="border-b border-white/20">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-6 py-6">

            <!-- Nombre del proyecto -->
            <a href="{% url 'inicio' %}"
               class="text-3xl font-black tracking-tight text-[#eff77a] sm:text-4xl">
                SportSync
            </a>

            <!-- Acceso de usuarios -->
            <div class="flex flex-wrap items-center gap-3">
                <!-- Se habilitarán cuando existan las páginas de acceso -->
                <button type="button" disabled
                        class="cursor-not-allowed rounded-full border border-white/60 px-5 py-2.5 text-sm font-bold opacity-70">
                    Iniciar sesión
                </button>

              <a href="{% url 'usuarios:registro' %}"
               class="rounded-full bg-[#eff77a] px-5 py-2.5 text-sm font-bold text-slate-900 transition hover:bg-[#e2ec59]">
                Registrarse
               </a>
            </div>

        </div>
    </header>

    <main class="flex-1">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="border-t border-white/20">
        <div class="mx-auto flex max-w-7xl flex-col gap-3 px-6 py-6 text-sm sm:flex-row sm:items-center sm:justify-between">
            <p>&copy; {% now "Y" %} SportSync.</p>

            <a href="{% url 'acerca' %}"
               class="underline underline-offset-4 hover:text-[#eff77a]">
                Acerca del proyecto
            </a>

            <p>Proyecto académico de Desarrollo de Software V.</p>
        </div>
    </footer>

</body>
</html>
